<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Constancia de Recarga - Banca Móvil</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link rel="stylesheet" href="styles.css">

    <style>
        * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important; 
            -webkit-user-select: none !important; 
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            outline: none !important;
            box-sizing: border-box;
        }

        input, textarea {
            -webkit-user-select: auto !important;
            user-select: auto !important;
        }

        img {
            pointer-events: none;
            -webkit-user-drag: none;
        }

        button, a {
            pointer-events: auto;
            cursor: pointer;
        }

        :root {
            --ibk-green: #00B14F;
            --ibk-dark-blue: #002D72;
            --qr-blue: #0137AB;
            --bg-light: #f7f9fa;
            --text-dark: #333333;
            --text-muted: #666666;
        }

        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            overscroll-behavior-y: none; 
        }

        .mobile-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background-color: white;
            position: relative;
        }

        /* ==================================================
           DISEÑO DE CONSTANCIA DE RECARGA
           ================================================== */
        .header { display: flex; justify-content: center; align-items: center; padding: 15px 20px; background-color: #ffffff; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border-bottom: none; z-index: 10; }
        .header-title { font-size: 16px; font-weight: 700; color: #000; }

        .content { flex: 1; overflow-y: auto; padding-bottom: 120px; display: flex; flex-direction: column; align-items: center; }
        .content::-webkit-scrollbar { width: 0px; background: transparent; }

        .success-header { display: flex; flex-direction: column; align-items: center; margin-top: 25px; margin-bottom: 20px; }
        
        .check-icon-container { width: 50px; height: 50px; background-color: #2bd071; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        .check-icon-container svg { width: 30px; height: 30px; stroke: white; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        
        .success-text { font-size: 16px; color: #000; font-weight: 400; margin-bottom: 5px; }
        
        .amount-display { color: #00b551; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
        .amount-currency { font-size: 22px; font-weight: 600; margin-right: 4px; }
        .amount-value { font-size: 24px; font-weight: 700; }

        .empresa-text { font-size: 15px; font-weight: 600; color: #000; }

        .ticket {
            position: relative;
            background-color: #F3F5F4;
            width: 85%;
            padding: 25px 20px;
            margin-bottom: 30px;
        }
        .ticket::before {
            content: ""; position: absolute; top: -10px; left: 0; right: 0; height: 10px;
            background-size: 20px 20px;
            background-image: radial-gradient(circle at 10px 10px, #F3F5F4 10px, transparent 11px);
        }
        .ticket::after {
            content: ""; position: absolute; bottom: -10px; left: 0; right: 0; height: 10px;
            background-size: 20px 20px;
            background-image: radial-gradient(circle at 10px 0, #F3F5F4 10px, transparent 11px);
        }

        .ticket-row { margin-bottom: 15px; display: flex; flex-direction: column; gap: 2px; }
        .ticket-row:last-child { margin-bottom: 0; }
        
        .ticket-label { font-size: 14px; font-weight: 700; color: #000; }
        .ticket-value { font-size: 14px; font-weight: 400; color: #222; }
        .ticket-value-sub { font-size: 13.5px; color: #333; }

        .btn-enviar-text { background: none; border: none; color: #00b551; font-size: 15px; font-weight: 600; cursor: pointer; padding: 10px; margin-bottom: 20px; }

        /* ==================================================
           BOTTOM NAV & FAB QR (BLINDADO CONTRA STYLES.CSS)
           ================================================== */
        .bottom-nav {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            background: white !important;
            display: flex !important;
            justify-content: space-around !important;
            align-items: center !important;
            padding: 10px 0 15px 0 !important;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05) !important;
            z-index: 100 !important;
            border: none !important;
            margin: 0 !important;
        }

        .nav-item {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            background: none !important;
            border: none !important;
            color: #434446 !important;
            font-size: clamp(9px, 2.5vw, 10px) !important;
            font-weight: 700 !important;
            font-family: 'Nunito', sans-serif !important;
            margin: 0 !important;
            padding: 0 !important;
            outline: none !important;
            text-decoration: none !important;
            cursor: pointer !important;
            pointer-events: auto !important;
        }
        
        .nav-item span {
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1.2 !important;
            border: none !important;
        }
        
        .nav-item.active {
            color: #015A1A !important;
            position: relative !important;
        }
        
        .nav-item.active::before {
            content: '' !important;
            position: absolute !important;
            top: -12px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: 35px !important;
            height: 4px !important;
            background-color: #015A1A !important;
            border-radius: 2px !important;
            border: none !important;
        }

        .nav-icon {
            width: clamp(18px, 5vw, 22px) !important;
            height: clamp(18px, 5vw, 22px) !important;
            margin-bottom: 4px !important;
            fill: currentColor !important;
            border: none !important;
            outline: none !important;
        }
        
        .nav-icon-img {
            width: clamp(18px, 5vw, 22px) !important;
            height: clamp(18px, 5vw, 22px) !important;
            margin-bottom: 4px !important;
            object-fit: contain !important;
            mix-blend-mode: multiply !important;
            filter: grayscale(100%) opacity(0.6) contrast(1.2) !important;
            pointer-events: none !important;
            border: none !important;
            outline: none !important;
        }

        .qr-fab-container {
            position: relative !important;
            width: 60px !important;
            display: flex !important;
            justify-content: center !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
        }

        .qr-fab {
            position: absolute !important;
            top: -35px !important;
            width: 55px !important;
            height: 55px !important;
            background-color: var(--qr-blue) !important;
            border-radius: 50% !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            box-shadow: 0 4px 10px rgba(1, 55, 171, 0.4) !important;
            border: 4px solid white !important;
            margin: 0 !important;
            padding: 0 !important;
        }
    </style>
</head>
<body>

    <audio id="notiSound" src="noti.mp3" preload="auto"></audio>

    <div class="mobile-wrapper" id="captureArea">
        
        <header class="header" id="topHeader">
            <div class="header-title">Constancia</div>
        </header>

        <div class="content">
            
            <div class="success-header">
                <div class="check-icon-container">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <div class="success-text">Recargaste</div>
                <div class="amount-display">
                    <span class="amount-currency" id="finalMoneda">S/</span>
                    <span class="amount-value" id="finalMonto">0.00</span>
                </div>
                <div class="empresa-text" id="finalEmpresaTop">a Empresa</div>
            </div>

            <div class="ticket">
                <div class="ticket-row">
                    <div class="ticket-label">Cuenta a Cargo:</div>
                    <div class="ticket-value" id="finalCargoNombre">Nombre Cuenta</div>
                    <div class="ticket-value-sub" id="finalCargoNum">*** *** ****</div>
                </div>

                <div class="ticket-row">
                    <div class="ticket-label">Celular:</div>
                    <div class="ticket-value" id="finalCelular">999999999</div>
                </div>

                <div class="ticket-row">
                    <div class="ticket-label">Fecha y hora:</div>
                    <div class="ticket-value" id="finalFechaHora">-- --- ---- &nbsp; --:-- --</div>
                </div>

                <div class="ticket-row">
                    <div class="ticket-label">Código de operación:</div>
                    <div class="ticket-value" id="finalCodigo">00000000</div>
                </div>
            </div>

            <button class="btn-enviar-text" id="actionButton" onclick="enviarConstancia()">Enviar constancia</button>

        </div>

        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item active" onclick="window.location.href='inicio.html'">
                <!-- stroke: none !important bloquea la delgada línea gris/negra que inyecta styles.css -->
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" style="stroke: none !important;">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" style="stroke: none !important;"/>
                </svg>
                <span>Inicio</span>
            </button>
            <button class="nav-item" onclick="irAOperaciones()">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m4 6H4m0 0l4 4m-4-4l4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Movimientos</span>
            </button>
            
            <div class="qr-fab-container">
                <div class="qr-fab">
                    <img src="img/qr.png" alt="QR" style="width: 26px; height: 26px; object-fit: contain; outline: none; border: none;" draggable="false" oncontextmenu="return false;">
                </div>
            </div>

            <button class="nav-item">
                <img src="img/beneficios.webp" alt="Beneficios" class="nav-icon-img" draggable="false" oncontextmenu="return false;">
                <span>Beneficios</span>
            </button>
            <button class="nav-item">
                <img src="img/para_ti.webp" alt="Para ti" class="nav-icon-img" draggable="false" oncontextmenu="return false;">
                <span>Para ti</span>
            </button>
        </nav>

    </div>

    <script>
        // --- NAVEGACIÓN A OPERACIONES ---
        function irAOperaciones() {
            localStorage.setItem('ibk_open_operations', 'true');
            window.location.href = 'inicio.html';
        }

        // --- CARGAR DATOS DINÁMICOS ---
        document.addEventListener('DOMContentLoaded', () => {
            
            const empresa = localStorage.getItem('ibk_recel_empresa') || 'Claro';
            const celular = localStorage.getItem('ibk_recel_celular') || '111111111';
            const cargoNombre = localStorage.getItem('ibk_recel_cargo_name') || 'Cuenta Simple Soles';
            const moneda = localStorage.getItem('ibk_recel_currency') || 'S/';
            
            let cargoNumRaw = localStorage.getItem('ibk_recel_cargo_num') || '191 2058951088';
            let cargoNumMasked = cargoNumRaw;
            if (cargoNumRaw.replace(/\s/g, '').length >= 12) {
                let clean = cargoNumRaw.replace(/\s/g, '');
                cargoNumMasked = `${clean.substring(0,4)} ${clean.substring(4,6)}** **** ${clean.substring(clean.length-4)}`;
            }

            let rawMonto = localStorage.getItem('ibk_recel_monto');
            let montoFinal = '0.00';
            if (rawMonto) {
                let cleanedMonto = rawMonto.replace(/[^\d.]/g, '');
                if (cleanedMonto && !isNaN(cleanedMonto)) {
                    montoFinal = parseFloat(cleanedMonto).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                }
            }

            document.getElementById('finalEmpresaTop').innerText = `a ${empresa}`;
            document.getElementById('finalMoneda').innerText = moneda;
            document.getElementById('finalMonto').innerText = montoFinal;
            
            document.getElementById('finalCargoNombre').innerText = cargoNombre;
            document.getElementById('finalCargoNum').innerText = cargoNumMasked;
            
            document.getElementById('finalCelular').innerText = celular;

            const opCode = Math.floor(10000000 + Math.random() * 90000000);
            document.getElementById('finalCodigo').innerText = `0${opCode}`.slice(-8);

            const now = new Date();
            const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            const day = now.getDate().toString().padStart(2, '0');
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const timeStr = `${hours.toString().padStart(2, '0')}:${minutes} ${ampm}`;
            
            document.getElementById('finalFechaHora').innerHTML = `${day} ${month} ${year} &nbsp;&nbsp; ${timeStr}`;
        });

        // --- LÓGICA PARA COMPARTIR CONSTANCIA ---
        function enviarConstancia() {
            const captureArea = document.getElementById('captureArea');
            const actionButton = document.getElementById('actionButton');
            const bottomNav = document.getElementById('bottomNav');
            
            actionButton.style.display = 'none';
            bottomNav.style.display = 'none';

            setTimeout(() => {
                html2canvas(captureArea, {
                    scale: 2, 
                    backgroundColor: '#ffffff' 
                }).then(canvas => {
                    canvas.toBlob(blob => {
                        let empresa = localStorage.getItem('ibk_recel_empresa') || 'Recarga';
                        let nombreParaArchivo = empresa.replace(/[^a-zA-Z0-9]/g, "_");
                        const file = new File([blob], `Constancia_Recarga_${nombreParaArchivo}.png`, { type: 'image/png' });
                        
                        if (navigator.share) {
                            navigator.share({
                                title: `Recarga de celular a ${empresa}`,
                                files: [file]
                            }).then(() => {
                                restaurarUI(actionButton, bottomNav);
                            }).catch(err => {
                                console.log('Error al compartir:', err);
                                restaurarUI(actionButton, bottomNav);
                            });
                        } else {
                            const link = document.createElement('a');
                            link.download = `Constancia_Recarga_${nombreParaArchivo}.png`;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                            restaurarUI(actionButton, bottomNav);
                        }
                    });
                });
            }, 150); 
        }

        function restaurarUI(actionButton, bottomNav) {
            actionButton.style.display = 'block';
            bottomNav.style.display = 'flex';
        }
    </script>
</body>
</html>
