<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Constancia - Plin</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
            box-sizing: border-box;
        }

        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
            pointer-events: none !important; 
        }

        input, textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        /* ==================================================
           NOTIFICACIÓN PUSH NATIVA (ANIMADA E INTERACTIVA)
           ================================================== */
        .push-notification {
            position: fixed;
            top: -100px; 
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background-color: #212121; 
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            z-index: 99999;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            touch-action: pan-y; 
        }

        .push-notification.show {
            top: 15px; 
        }

        .push-notification.dismissed {
            transition: transform 0.3s ease-in, opacity 0.3s ease-in !important;
            transform: translate(100vw, 0) !important;
            opacity: 0;
        }

        .push-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 6px;
        }

        .push-content-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .push-app-name {
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
        }

        .push-message {
            color: #d1d1d1;
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.3;
        }

        /* HEADER */
        .header { display: flex; justify-content: center; align-items: center; padding: 15px 20px; background-color: #ffffff; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border-bottom: none; z-index: 10; }
        .header-title { font-size: 16px; font-weight: 700; color: #000; }

        /* CONTENIDO PRINCIPAL */
        body { 
            font-family: 'Nunito', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #ffffff; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            position: relative; 
        }

        .mobile-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background-color: white;
            position: relative;
        }

        .content { 
            flex: 1; 
            overflow-y: auto; 
            padding-bottom: 130px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .content::-webkit-scrollbar { width: 0px; background: transparent; }

        /* SECCIÓN SUPERIOR DE ÉXITO */
        .success-header { display: flex; flex-direction: column; align-items: center; margin-top: 25px; margin-bottom: 25px; }
        .success-icon { width: 55px; height: 55px; object-fit: contain; margin-bottom: 10px; }
        .success-text { font-size: 16px; color: #000; font-weight: 400; margin-bottom: 5px; }
        
        .amount-display { color: #00b551; display: flex; align-items: flex-start; justify-content: center; }
        .amount-currency { font-size: 22px; font-weight: 600; margin-right: 4px; margin-top: 4px; }
        .amount-value { font-size: 42px; font-weight: 600; letter-spacing: -1px; line-height: 1; }

        /* TICKET CON BORDES ONDULADOS */
        .ticket {
            position: relative;
            background-color: #F3F5F4;
            width: 85%;
            padding: 25px 20px;
            margin-bottom: 30px;
        }
        .ticket::before {
            content: ""; position: absolute; top: -10px; left: 0; right: 0; height: 10px;
            background-size: 20px 20px;
            background-image: radial-gradient(circle at 10px 10px, #F3F5F4 10px, transparent 11px);
        }
        .ticket::after {
            content: ""; position: absolute; bottom: -10px; left: 0; right: 0; height: 10px;
            background-size: 20px 20px;
            background-image: radial-gradient(circle at 10px 0, #F3F5F4 10px, transparent 11px);
        }

        /* DATOS DEL TICKET */
        .ticket-row { margin-bottom: 15px; }
        .ticket-row:last-child { margin-bottom: 0; }
        
        .ticket-label { font-size: 14.5px; font-weight: 700; color: #000; margin-bottom: 2px; }
        .ticket-value { font-size: 14.5px; font-weight: 400; color: #222; }
        
        .badge-gratis { background-color: #00b551; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; display: inline-block; margin-top: 2px; }

        .text-group { display: flex; flex-direction: column; gap: 2px; }

        /* BOTONES (PEGADOS ABAJO) */
        .actions-container { 
            width: 85%; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-top: auto; 
            margin-bottom: 0px; 
        }
        
        .btn-enviar { background-color: #00b551; color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; pointer-events: auto; }
        .btn-enviar:active { background-color: #009e47; }
        
        .btn-volver { background-color: white; color: #00b551; border: 1.5px solid #00b551; width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: flex; justify-content: center; align-items: center; pointer-events: auto;}
        .btn-volver:active { background-color: #f0fdf4; }

        /* ==================================================
           BOTTOM NAV & FAB QR (ALINEADO CON INICIO.HTML)
           ================================================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 15px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: #434446;
            font-size: clamp(9px, 2.5vw, 10px);
            font-weight: 700;
            font-family: inherit;
            pointer-events: auto;
            cursor: pointer;
        }
        
        .nav-item.active {
            color: #015A1A;
            position: relative;
        }
        
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 4px;
            background-color: #015A1A;
            border-radius: 2px;
        }

        .nav-icon, .nav-icon-img {
            width: clamp(18px, 5vw, 22px);
            height: clamp(18px, 5vw, 22px);
            margin-bottom: 4px;
        }

        .nav-icon { fill: currentColor; }
        
        .nav-icon-img { 
            object-fit: contain; 
            mix-blend-mode: multiply; 
            filter: grayscale(100%) opacity(0.6) contrast(1.2); 
        }

        .qr-fab-container {
            position: relative;
            width: 60px;
            display: flex;
            justify-content: center;
            pointer-events: auto;
            cursor: pointer;
        }

        .qr-fab {
            position: absolute;
            top: -35px;
            width: 55px;
            height: 55px;
            background-color: #0137AB !important;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(1, 55, 171, 0.4);
            border: 4px solid white;
        }
    </style>
</head>
<body>

    <!-- NOTIFICACIÓN PUSH NATIVA -->
    <div id="pushNotification" class="push-notification">
        <img src="img/interbank_wrdgas.webp" alt="Interbank" class="push-icon">
        <div class="push-content-text">
            <div class="push-app-name">Interbank</div>
            <div class="push-message" id="pushMessageText">Plineaste S/ 0.00 a Usuario</div>
        </div>
        <img src="img/interbank_wrdgas.webp" alt="Interbank" class="push-icon">
    </div>

    <div class="mobile-wrapper" id="captureArea">

        <header class="header" id="topHeader">
            <div class="header-title">Constancia</div>
        </header>

        <div class="content">
            
            <div class="success-header">
                <img src="img/plin-voucher.webp" alt="Plin" class="success-icon">
                <div class="success-text">¡Pago exitoso!</div>
                <div class="amount-display">
                    <span class="amount-currency">S/</span>
                    <span class="amount-value" id="finalMonto">0.00</span>
                </div>
            </div>

            <div class="ticket">
                
                <div class="ticket-row">
                    <div class="ticket-label">Enviado a:</div>
                    <div class="ticket-value text-group">
                        <span id="finalNombre">Nombre Destino</span>
                        <span id="finalCelular" style="color: #666; font-size: 14px; display: none;">999 999 999</span>
                    </div>
                </div>

                <div class="ticket-row">
                    <div class="ticket-label">Destino:</div>
                    <div class="ticket-value" id="finalDestino">Plin</div>
                </div>

                <div class="ticket-row">
                    <div class="ticket-label">Comisión:</div>
                    <div class="badge-gratis">GRATIS</div>
                </div>

                <div class="ticket-row">
                    <div class="ticket-label">Fecha y hora:</div>
                    <div class="ticket-value" id="finalFechaHora">-- --- ---- &nbsp; --:-- --</div>
                </div>

                <div class="ticket-row">
                    <div class="ticket-label">Código de operación:</div>
                    <div class="ticket-value" id="finalCodigo">00000000</div>
                </div>

            </div>

            <div class="actions-container" id="actionButtons">
                <button class="btn-enviar" onclick="enviarConstancia()">Enviar constancia</button>
                <a href="inicio.html" class="btn-volver">Volver a Plin</a>
            </div>

        </div>

        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item active" onclick="window.location.href='inicio.html'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>Inicio</span>
            </button>
            <button class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m4 6H4m0 0l4 4m-4-4l4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Movimientos</span>
            </button>
            
            <div class="qr-fab-container">
                <div class="qr-fab">
                    <img src="img/qr.png" alt="QR" style="width: 26px; height: 26px; object-fit: contain;" draggable="false" oncontextmenu="return false;">
                </div>
            </div>

            <button class="nav-item">
                <img src="img/beneficios.webp" alt="Beneficios" class="nav-icon-img" draggable="false" oncontextmenu="return false;">
                <span>Beneficios</span>
            </button>
            <button class="nav-item">
                <img src="img/para_ti.webp" alt="Para ti" class="nav-icon-img" draggable="false" oncontextmenu="return false;">
                <span>Para ti</span>
            </button>
        </nav>

    </div>

    <script>
        let pushTimeout;

        // --- 1. CARGAR DATOS DINÁMICOS Y NOTIFICACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            const montoEnvio = localStorage.getItem('ibk_plin_monto') || '0.00';
            const nombreDestino = localStorage.getItem('ibk_plin_nombre') || 'Destinatario';
            const destinoBanco = localStorage.getItem('ibk_plin_destino') || 'Plin';
            const isQR = localStorage.getItem('ibk_plin_isQR') === 'true';
            
            const montoFormateado = parseFloat(montoEnvio).toFixed(2);

            document.getElementById('finalMonto').innerText = montoFormateado;
            document.getElementById('finalNombre').innerText = nombreDestino;
            document.getElementById('finalDestino').innerText = destinoBanco;

            // DISPARAR NOTIFICACIÓN PUSH
            const pushNoti = document.getElementById('pushNotification');
            document.getElementById('pushMessageText').innerText = `Plineaste S/ ${montoFormateado} a ${nombreDestino}`;

            setTimeout(() => {
                pushNoti.classList.add('show'); 
                
                try {
                    let audio = new Audio('img/noti.mp3');
                    audio.play().catch(e => console.log("El navegador requiere interacción previa para reproducir audio."));
                } catch(e){}

                pushTimeout = setTimeout(() => {
                    pushNoti.classList.remove('show');
                }, 3000);

            }, 500); 

            if (!isQR) {
                let celularDestino = localStorage.getItem('ibk_plin_celular') || "999999999";
                if(celularDestino.length === 9) {
                    celularDestino = `${celularDestino.slice(0,3)} ${celularDestino.slice(3,6)} ${celularDestino.slice(6,9)}`;
                }
                document.getElementById('finalCelular').innerText = celularDestino;
                document.getElementById('finalCelular').style.display = 'block';
            } else {
                document.getElementById('finalCelular').style.display = 'none';
            }

            const opCode = Math.floor(10000000 + Math.random() * 90000000);
            document.getElementById('finalCodigo').innerText = `0${opCode}`.slice(-8);

            const now = new Date();
            const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            const day = now.getDate().toString().padStart(2, '0');
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            
            const timeStr = `${hours.toString().padStart(2, '0')}:${minutes} ${ampm}`;
            
            document.getElementById('finalFechaHora').innerHTML = `${day} ${month} ${year} &nbsp;&nbsp; ${timeStr}`;
        });

        // LÓGICA DE DESLIZAMIENTO (SWIPE)
        const pushNoti = document.getElementById('pushNotification');
        let touchStartX = 0;

        pushNoti.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        pushNoti.addEventListener('touchmove', e => {
            let currentX = e.changedTouches[0].screenX;
            let deltaX = currentX - touchStartX;
            
            if (deltaX > 0) {
                pushNoti.style.transition = 'none'; 
                pushNoti.style.transform = `translateX(calc(-50% + ${deltaX}px))`;
            }
        }, {passive: true});

        pushNoti.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let deltaX = touchEndX - touchStartX;
            
            pushNoti.style.transition = 'transform 0.3s ease-in, opacity 0.3s ease-in';
            
            if (deltaX > 80) { 
                clearTimeout(pushTimeout);
                pushNoti.classList.add('dismissed');
            } else {
                pushNoti.style.transform = `translateX(-50%)`; 
            }
        }, {passive: true});

        // LÓGICA PARA COMPARTIR CONSTANCIA
        function enviarConstancia() {
            const captureArea = document.getElementById('captureArea');
            const actionButtons = document.getElementById('actionButtons');
            const bottomNav = document.getElementById('bottomNav');
            
            actionButtons.style.display = 'none';
            bottomNav.style.display = 'none';
            pushNoti.style.display = 'none';

            setTimeout(() => {
                html2canvas(captureArea, {
                    scale: 2, 
                    backgroundColor: '#ffffff'
                }).then(canvas => {
                    canvas.toBlob(blob => {
                        let nombreParaArchivo = document.getElementById('finalNombre').innerText.replace(/[^a-zA-Z0-9]/g, "_");
                        const file = new File([blob], `Constancia_Plin_${nombreParaArchivo}.png`, { type: 'image/png' });
                        
                        if (navigator.share) {
                            navigator.share({
                                title: `Constancia Plin a ${nombreParaArchivo}`,
                                files: [file]
                            }).then(() => {
                                restaurarUI(actionButtons, bottomNav);
                            }).catch(err => {
                                console.log('Error al compartir:', err);
                                restaurarUI(actionButtons, bottomNav);
                            });
                        } else {
                            const link = document.createElement('a');
                            link.download = `Constancia_Plin_${nombreParaArchivo}.png`;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                            restaurarUI(actionButtons, bottomNav);
                        }
                    });
                });
            }, 150); 
        }

        function restaurarUI(actionButtons, bottomNav) {
            actionButtons.style.display = 'flex';
            bottomNav.style.display = 'flex';
        }
    </script>
</body>
</html>
